aid: azuqua
name: Azuqua
description: >-
  Azuqua was a Seattle-based integration platform as a service (iPaaS) and no-code workflow-automation
  company, backed by Insight Partners and Techstars, that let business teams build integrations and
  automated workflows (FLOs) across SaaS applications such as Salesforce, Slack, Marketo and ServiceNow.
  Azuqua was acquired by Okta in 2019 and its workflow orchestration engine and connectors were folded
  into Okta Workflows (part of Okta Lifecycle Management). The standalone product is now end-of-life:
  azuqua.com serves an acquisition notice and the API is no longer available for purchase. This API
  Evangelist profile documents the surviving public developer surface (legacy ReadMe docs, changelog,
  llms.txt) and the product's lifecycle status.
