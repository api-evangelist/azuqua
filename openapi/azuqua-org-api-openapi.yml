openapi: 3.2.0
info:
  title: page Org API
  version: '2.0'
servers:
- url: https://api.azuqua.com
security:
- sec0: []
  sec1: []
  sec2: []
tags:
- name: Org
paths:
  /v2/org:
    get:
      summary: Read Organization
      description: Read information about your organization.
      operationId: read-organization
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{ \n  \"id\": 123,\n  \"name\": 'My Test Org',\n  \"display_name\": 'Test Org',\n  \"active\": true,\n  \"created\": '2017-03-28T20:57:08.624Z',\n  \"updated\": '2017-07-28T21:38:28.451Z',\n  \"flos_migrated\": true,\n  \"publisher\": 'PUBLISHER_ORG_50',\n  \"privileges\": \n   [ \n     { \"resource\": 'USER', \"privilege\": 'ADD' },\n     { \"resource\": 'USER', \"privilege\": 'REMOVE' },\n     { \"resource\": 'USER', \"privilege\": 'CHANGEROLE' },\n     { \"resource\": 'USER', \"privilege\": 'CHANGEORGROLE' },\n     { \"resource\": 'USER', \"privilege\": 'READ' },\n     { \"resource\": 'ORG', \"privilege\": 'READ' },\n     { \"resource\": 'FLO', \"privilege\": 'CREATE' },\n     { \"resource\": 'CONFIG', \"privilege\": 'CREATE' } \n   ],\n  \"role_type\": 'BILLINGADMIN' \n}"
      deprecated: false
      tags:
      - Org
    put:
      summary: Update Org
      description: Update metadata about your organization (name, description).
      operationId: update-org
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name that will replace your organization's current name.
                description:
                  type: string
                  description: The description that will replace your organization's existing description.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "//This will respond back with the field that was updated. In this case, only the name was updated.\n{ \n  \"name\": 'MY NEW NAME'\n}"
      deprecated: false
      tags:
      - Org
  /v2/org/flos:
    get:
      summary: Read All FLOs
      description: Get a list of all the FLOs inside of your organization.
      operationId: get-flos-in-organization
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[ \n  { \n    \"id\": 123,\n    \"alias\": 'this_is_my_alias',\n    \"name\": 'Test with Event',\n    \"active\": false,\n    \"published\": false,\n    \"security_level\": null,\n    \"client_token\": 'this_is_this_flos_client_token',\n    \"description\": '',\n    \"updated\": '2017-07-31T17:00:53.624Z',\n    \"created\": '2017-07-31T16:35:48.624Z',\n    \"type\": null,\n    \"role_type\": 'CREATOR',\n    \"privileges\": \n     [ \n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object],\n       [Object] \n     ] \n  }\n ]\n"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "//Occurs if you have no FLOs in your organization\n{ \n  \"errors\": \n   [ \n     { \n       \"title\": 'Not Found',\n       \"message\": 'Not Found. Check that you have access to resource'\n     } \n   ] \n}"
      deprecated: false
      tags:
      - Org
  /v2/org/user/{user_id}/permissions:
    put:
      summary: Update User Role in Organization
      description: Update a user's role (billing admin, admin, member) inside your organization. Note, you may not update someone away from being billing admin.
      operationId: update-user-role
      parameters:
      - name: user_id
        in: path
        description: The ID of the user whose role you would like to change.
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
                  description: The role you would like to update the user to. Can be either "BILLING ADMIN", "ADMIN", or "MEMBER".
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{ "changed": true }'
              schema:
                type: object
                properties:
                  changed:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "//Occurs if you pass in an invalid value as the \"role\" parameter \n{ \n  \"errors\": \n   [ \n     { \n       \"title\": 'Bad Request',\n       \"message\": 'Error at parameter role: No enum match for: \"INVALID_NAME_HERE\"' \n     } \n   ] \n}"
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "//Occurs when the user doesn't exist\n{\n  \"errors\": \n   [ \n     { \n       \"title\": 'Not Found',\n       \"message\": 'Not Found. Check that you have access to resource'\n     } \n   ]\n}"
      deprecated: false
      tags:
      - Org
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: x-api-accesskey
    sec1:
      type: apiKey
      in: header
      name: x-api-hash
    sec2:
      type: apiKey
      in: header
      name: x-api-timestamp
